<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KittyVerse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="welcomeMessage">Welcome! Please connect your wallet to start.</div>
    <button id="connectWalletBtn">Connect Wallet</button>
    <div id="gameContainer" style="display: none;">
        <button id="startGameBtn">Start Game</button>
        <canvas id="gameCanvas" style="border: 1px solid black; width: 400px; height: 400px;"></canvas>
        <div>Score: <span id="scoreboard">0</span></div>
        <div>Time Left: <span id="timeLeft">60s</span></div>
        <button id="claimRewardsBtn">Claim Rewards</button>
    </div>

    <!-- Load Keplr -->
    <script src="https://unpkg.com/@keplr-wallet/window@latest"></script>
    <script type="module" src="wallet.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>

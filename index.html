<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keplr Wallet Integration</title>
  <script src="https://cdn.jsdelivr.net/npm/@cosmjs/stargate@0.26.0/dist/index.min.js"></script>
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <div id="welcomeMessage">
    <p>Welcome! Please connect your wallet.</p>
    <button id="connectWalletBtn">Connect Wallet</button>
  </div>
  <div id="gameContainer" style="display: none;">
    <button id="startGameBtn" style="display: none;">Start Game</button>
    <div id="scoreboard">Score: 0</div>
    <div id="timeLeft">Time Left: 60s</div>
    <!-- Game content goes here -->
    <button id="claimRewardsBtn">Claim Rewards</button>
  </div>
</body>
</html>
